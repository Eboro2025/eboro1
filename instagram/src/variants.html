<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Baloo+2:wght@600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:#999;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}
.c{position:relative;overflow:hidden;width:1080px;height:1350px}
.pad{position:absolute;inset:0;padding:90px;display:flex;flex-direction:column}
.chip{background:#fff;border-radius:24px;padding:14px 24px;display:inline-flex}
.chip img{height:80px}
</style></head><body>

<!-- A: app illustration, clean white -->
<section id="A" class="c" style="background:#fff">
  <div style="position:absolute;left:0;right:0;bottom:0;height:430px;background:#EEF0F2"></div>
  <img src="scene.png" style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:840px">
  <div class="pad" style="align-items:center;text-align:center">
    <img src="logo.png" style="height:130px">
    <p style="margin-top:40px;font-size:44px;font-weight:600;color:#3D5A70">Il tuo primo ordine?</p>
    <h1 style="font-size:250px;font-weight:900;line-height:1;color:#C12732;letter-spacing:-.03em">-3€</h1>
    <div style="margin-top:20px;font-size:40px;color:#3D5A70">con il codice <b style="color:#fff;background:#C12732;border-radius:14px;padding:6px 22px;letter-spacing:.05em">BENVENUTO</b></div>
  </div>
</section>

<!-- B: dark premium -->
<section id="B" class="c" style="background:radial-gradient(120% 80% at 80% 0%,#2A4A63 0%,#0F1C27 60%)">
  <div style="position:absolute;right:-120px;top:-120px;width:620px;height:620px;border-radius:50%;border:2px solid rgba(240,138,36,.35)"></div>
  <div style="position:absolute;right:-40px;top:-40px;width:460px;height:460px;border-radius:50%;border:2px solid rgba(240,138,36,.2)"></div>
  <div class="pad" style="color:#fff">
    <span class="chip" style="align-self:flex-start"><img src="logo.png"></span>
    <div style="margin-top:auto">
      <p style="font-size:30px;letter-spacing:.3em;text-transform:uppercase;color:#F5A04A;font-weight:600">Benvenuto in Eboro</p>
      <h1 style="font-family:'Playfair Display',serif;font-size:300px;line-height:.95;font-weight:900;margin-top:20px">3€</h1>
      <p style="font-family:'Playfair Display',serif;font-size:72px;font-weight:700;line-height:1.1">in regalo sul<br>primo ordine.</p>
      <div style="height:2px;background:linear-gradient(90deg,#F5A04A,transparent);margin:56px 0 36px"></div>
      <p style="font-size:34px;opacity:.85">Codice <b style="color:#F5A04A;letter-spacing:.12em">BENVENUTO</b> &nbsp;·&nbsp; link in bio</p>
    </div>
  </div>
</section>

<!-- C: bright playful -->
<section id="C" class="c" style="background:#FFC531">
  <div style="position:absolute;left:-200px;bottom:-260px;width:900px;height:900px;border-radius:50%;background:#FF8A3D"></div>
  <div style="position:absolute;right:-160px;top:220px;width:420px;height:420px;border-radius:50%;background:#FFE08A"></div>
  <div style="position:absolute;font-size:150px;right:110px;top:300px;transform:rotate(12deg)">🍕</div>
  <div style="position:absolute;font-size:130px;right:330px;bottom:200px;transform:rotate(-14deg)">🍔</div>
  <div style="position:absolute;font-size:120px;right:90px;bottom:420px;transform:rotate(8deg)">🛒</div>
  <div class="pad" style="font-family:'Baloo 2',sans-serif;color:#2B1B0E">
    <span class="chip" style="align-self:flex-start;border-radius:999px"><img src="logo.png" style="height:70px"></span>
    <h1 style="font-size:150px;line-height:.9;font-weight:800;margin-top:70px;color:#C12732">Primo<br>ordine?</h1>
    <div style="margin-top:30px;background:#C12732;color:#fff;align-self:flex-start;border-radius:40px;padding:10px 50px 0;transform:rotate(-3deg)">
      <span style="font-size:230px;font-weight:800;line-height:1">-3€</span>
    </div>
    <div style="margin-top:auto;background:#fff;align-self:flex-start;border-radius:999px;padding:18px 40px;font-size:48px;font-weight:800">usa <span style="color:#C12732">BENVENUTO</span> 😋</div>
  </div>
</section>
</body></html>
